# ДЕВ-конфиг: как прод, но без редиректа на https — сайт живёт прямо на 80.
proxy_cache_path /tmp/ngcache keys_zone=micro:2m max_size=10m;

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /www;
    index index.html;

    location = /active.json {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache micro;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }
    location /regions/ { expires 1h; }
    location /vendor/  { expires 7d; }
    location ~* \.png$ { expires 7d; }
    location / { try_files $uri $uri/ =404; }
}
